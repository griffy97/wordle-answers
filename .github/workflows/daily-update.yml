name: Daily Wordle Answer Update

on:
  schedule:
    # 19:01 UTC = 12:01 PDT (UTC-7).  In winter (PST = UTC-8) this fires at
    # 11:01 AM Pacific — one hour early, but still well past midnight Eastern
    # when the NYT puzzle goes live.
    - cron: '1 19 * * *'
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  update-answers:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push the updated answers.json back

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest answer
        run: python update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add answers.json
          git diff --staged --quiet && echo "Nothing new to commit." && exit 0
          git commit -m "Add Wordle answer for $(date -u +%Y-%m-%d)"
          git push
